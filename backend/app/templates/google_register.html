<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akademus | Concluir Pré-Cadastro (Google)</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 24, 38, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #6366f1;
      --accent: #06b6d4;
    }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; margin: 0; }
    .box { width: 100%; max-width: 480px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 2.25rem; backdrop-filter: blur(16px); }
    .user-info { display: flex; align-items: center; gap: 12px; background: rgba(15, 23, 42, 0.6); padding: 12px 16px; border-radius: 12px; margin-bottom: 1.5rem; border: 1px solid rgba(255,255,255,0.06); }
    .user-avatar { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--accent); }
    .form-group { margin-bottom: 1.25rem; }
    .form-label { display: block; font-size: 0.825rem; font-weight: 600; color: #94a3b8; margin-bottom: 0.5rem; }
    .form-input { width: 100%; padding: 0.8rem 1rem; background: #020617; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; box-sizing: border-box; }
    .btn-submit { width: 100%; padding: 0.875rem; background: var(--primary); color: #fff; border: none; border-radius: 12px; font-weight: 600; font-size: 0.95rem; cursor: pointer; }
    .btn-submit:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <div class="box">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <h1 style="font-family: 'Outfit'; font-size: 1.75rem;">Quase lá!</h1>
      <p style="color: #94a3b8; font-size: 0.9rem; margin-top: 4px;">Complete seu vínculo acadêmico para envio à moderação.</p>
    </div>

    <div class="user-info">
      {% if pending_user.picture %}
      <img src="{{ pending_user.picture }}" class="user-avatar" alt="Avatar">
      {% endif %}
      <div>
        <div style="font-weight: 600;">{{ pending_user.name }}</div>
        <div style="font-size: 0.8rem; color: #94a3b8;">{{ pending_user.email }}</div>
      </div>
    </div>

    {% if error %}
    <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem;">
      {{ error }}
    </div>
    {% endif %}

    <form action="/login/google/complete" method="POST">
      <div class="form-group">
        <label class="form-label">Perfil Acadêmico</label>
        <select name="role_type" id="google-role" class="form-input" onchange="toggleGoogleRa()">
          <option value="ALUNO">Aluno (Estudante)</option>
          <option value="PROFESSOR">Professor (Docente)</option>
          <option value="PARCEIRO">Parceiro Acadêmico</option>
        </select>
      </div>

      <div class="form-group" id="google-ra-group">
        <label class="form-label">Registro de Aluno (RA) <span style="color:#ef4444;">*</span></label>
        <input type="text" name="ra" id="google-ra-input" class="form-input" placeholder="Ex: 82012345" required>
      </div>

      <div class="form-group">
        <label class="form-label">Universidade / Instituição <span style="color:#ef4444;">*</span></label>
        <select name="university_id" class="form-input" required>
          <option value="">Selecione sua instituição...</option>
          {% for uni in universities %}
          <option value="{{ uni.id }}">{{ uni.short_name }} ({{ uni.name }})</option>
          {% endfor %}
        </select>
      </div>

      <button type="submit" class="btn-submit">Enviar para Aprovação</button>
    </form>
  </div>

  <script>
    function toggleGoogleRa() {
      const role = document.getElementById('google-role').value;
      const group = document.getElementById('google-ra-group');
      const input = document.getElementById('google-ra-input');
      if (role === 'ALUNO') {
        group.style.display = 'block';
        input.required = true;
      } else {
        group.style.display = 'none';
        input.required = false;
        input.value = '';
      }
    }
  </script>
</body>
</html>
